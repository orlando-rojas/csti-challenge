name: Storybook

on:
  push:
    branches: [master]
    paths:
      - "src/**/*.tsx"
      - "src/**/*.css"
      - ".storybook/**"
      - "Dockerfile.storybook"
      - "docker-compose.storybook.yml"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: read
  packages: write

jobs:
  storybook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.storybook
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-storybook:${{ github.sha }}
            ghcr.io/${{ github.repository }}-storybook:latest
      - name: Redeploy Storybook on Dokploy
        env:
          DOKPLOY_STORYBOOK_WEBHOOK_URL: ${{ secrets.DOKPLOY_STORYBOOK_WEBHOOK_URL }}
        run: |
          if [ -z "$DOKPLOY_STORYBOOK_WEBHOOK_URL" ]; then
            echo "Storybook webhook is not configured."
            exit 0
          fi
          curl -fsS -X POST "$DOKPLOY_STORYBOOK_WEBHOOK_URL"
