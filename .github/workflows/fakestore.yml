name: FakeStore

on:
  push:
    branches: [main]
    paths:
      - "services/fakestore/**"
      - "src/modules/catalog/infrastructure/fixtures/**"
      - "docker-compose.fakestore.yml"

permissions:
  contents: read
  packages: write

jobs:
  fakestore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: services/fakestore/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-fakestore:${{ github.sha }}
            ghcr.io/${{ github.repository }}-fakestore:latest
      - name: Redeploy FakeStore on Dokploy
        env:
          DOKPLOY_FAKESTORE_WEBHOOK_URL: ${{ secrets.DOKPLOY_FAKESTORE_WEBHOOK_URL }}
        run: |
          if [ -z "$DOKPLOY_FAKESTORE_WEBHOOK_URL" ]; then
            echo "FakeStore webhook is not configured."
            exit 0
          fi
          curl -fsS -X POST "$DOKPLOY_FAKESTORE_WEBHOOK_URL"
