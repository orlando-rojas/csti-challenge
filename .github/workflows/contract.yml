name: Contract

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:contract
      - name: Open an issue when the contract fails
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing="$(gh issue list --search 'FakeStore contract failed in:title state:open' --json number --jq 'length')"
          if [ "$existing" = "0" ]; then
            gh issue create \
              --title "FakeStore contract failed" \
              --body "The scheduled schema check against FakeStore failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
